name: Day 1 correctness
on: [push, pull_request]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p bpe-wasm --target wasm32-unknown-unknown
      - run: python -m maturin build --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python scripts/check_python.py
      - run: python scripts/check_baselines.py
      - run: python scripts/check_determinism.py
      - run: python bench/run.py --config bench/configs/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/day1-smoke
