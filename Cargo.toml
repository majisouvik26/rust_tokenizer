[workspace]
members = ["bpe", "bpe-cli", "bindings/python", "bindings/wasm"]
default-members = ["bpe", "bpe-cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bpe = { path = "bpe" }
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
base64 = "=0.22.1"
fancy-regex = "=0.14.0"
sha2 = "=0.10.8"
thiserror = "=2.0.11"
clap = { version = "=4.5.31", features = ["derive"] }
pyo3 = { version = "=0.23.5", features = ["extension-module", "abi3-py39"] }
wasm-bindgen = "=0.2.100"
rayon = "=1.10.0"

[profile.release]
lto = false
codegen-units = 1
